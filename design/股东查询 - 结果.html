<!DOCTYPE html>

<head>

    <title>股东查询 - 结果</title>
    <style id="theme-vars">
:root {
  /* Brand - cool indigo for finance/tool tone */
  --brand-50: #eef2ff;
  --brand-100: #e0e7ff;
  --brand-200: #c7d2fe;
  --brand-300: #a5b4fc;
  --brand-400: #818cf8;
  --brand-500: #6366f1;
  --brand-600: #4f46e5;
  --brand-700: #4338ca;
  --brand-800: #3730a3;
  --brand-900: #312e81;

  /* Neutral */
  --gray-0: #ffffff;
  --gray-50: #f8fafc;
  --gray-100: #f1f5f9;
  --gray-200: #e2e8f0;
  --gray-300: #cbd5e1;
  --gray-400: #94a3b8;
  --gray-500: #64748b;
  --gray-600: #475569;
  --gray-700: #334155;
  --gray-800: #1e293b;
  --gray-900: #0f172a;

  /* Semantic aliases */
  --brand-background: var(--gray-0);
  --brand-foreground: var(--gray-900);
  --brand-card: var(--gray-50);
  --brand-card-foreground: var(--gray-900);
  --brand-popover: var(--gray-0);
  --brand-popover-foreground: var(--gray-900);
  --brand-primary: var(--brand-600);
  --brand-primary-foreground: var(--gray-0);
  --brand-muted: var(--gray-100);
  --brand-muted-foreground: var(--gray-500);
  --brand-border: var(--gray-200);
  --brand-input: var(--gray-200);
  --brand-ring: var(--brand-500);
  --brand-radius-sm: 4px;
  --brand-radius-md: 8px;
  --brand-radius-lg: 12px;

  /* State colors */
  --state-success: #10b981;
  --state-warning: #f59e0b;
  --state-error: #ef4444;
  --state-info: var(--brand-500);

  /* Typography */
  --font-sans: "Inter", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: "SF Mono", "Fira Code", "PingFang SC", monospace;

  /* Spacing */
  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 20px;
  --s-6: 24px;
  --s-7: 32px;
  --s-8: 40px;

  /* Shadows */
  --shadow-1: 0 1px 2px rgba(15, 23, 42, 0.05);
  --shadow-2: 0 4px 12px rgba(15, 23, 42, 0.08);
  --shadow-3: 0 12px 32px rgba(15, 23, 42, 0.12);
}

html {
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  background: var(--brand-background);
  color: var(--brand-foreground);
}

/* Numeric tables */
.tabular-nums {
  font-variant-numeric: tabular-nums;
}

/* Reduced motion */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}

    </style>

    <style type="text/tailwindcss">

    --color-background: var(--brand-background);
    --color-foreground: var(--brand-foreground);

    --color-card-foreground: var(--brand-card-foreground);
    --color-popover: var(--brand-popover);

    --color-primary-foreground: var(--brand-primary-foreground);

    --radius-sm: var(--brand-radius-sm);

  @layer base {
    body { background: var(--brand-background); color: var(--brand-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }

    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;

        -webkit-mask-repeat: no-repeat;

<body class="min-h-screen font-sans antialiased">
    <div data-page-node-id="page-shareholder-query-results" data-state-group="shareholder-query" data-state-role="derived" data-derived-from="pages/shareholder-query-base.html" class="flex h-screen w-full overflow-hidden bg-background text-foreground">

                        <div class="flex gap-3">
                            <div class="relative flex-1">

                                <input data-dom-id="search-input" id="search-input" type="text" value="张三" placeholder="输入股东姓名或 A 股代码…" class="h-10 w-full cursor-text rounded-md border border-input bg-background pl-9 pr-[4.5rem] text-sm text-foreground placeholder:text-muted-foreground focus:border-ring focus:outline-none focus:ring-2 focus:ring-ring/20" />

                                    清除

                            </div>
                            <button data-dom-id="search-button" type="button" class="inline-flex h-10 cursor-pointer items-center justify-center rounded-md bg-primary px-5 text-sm font-medium text-primary-foreground transition-colors hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-ring/20">

                    </div>

                        <table class="w-full text-sm">
                            <thead>
                                <tr class="border-b border-border bg-muted/50 text-left text-muted-foreground">

                                    <th class="px-4 py-3 font-medium">本期持股</th>
                                    <th class="px-4 py-3 font-medium">时间</th>

                                </tr>
                            </thead>

                                    <td class="px-4 py-3">张三</td>

                                    <td class="px-4 py-3">

                                    </td>
                                </tr>
                                <tr class="border-b border-border transition-colors hover:bg-muted/30">
                                    <td class="px-4 py-3 tabular-nums">000858</td>
                                    <td class="px-4 py-3">五粮液</td>
                                    <td class="px-4 py-3">张三</td>
                                    <td class="px-4 py-3 tabular-nums">890,000</td>
                                    <td class="px-4 py-3 whitespace-nowrap tabular-nums">2026-06-30</td>
                                    <td class="px-4 py-3">
                                        <span class="inline-flex items-center rounded-full px-2 py-0.5 text-xs font-medium" style="color: var(--state-success); background-color: rgba(16, 185, 129, 0.1);">−30,000</span>
                                    </td>
                                </tr>
                                <tr class="border-b border-border transition-colors hover:bg-muted/30">
                                    <td class="px-4 py-3 tabular-nums">002594</td>
                                    <td class="px-4 py-3">比亚迪</td>
                                    <td class="px-4 py-3">张三</td>
                                    <td class="px-4 py-3 tabular-nums">620,000</td>
                                    <td class="px-4 py-3 whitespace-nowrap tabular-nums">2026-03-31</td>
                                    <td class="px-4 py-3">
                                        <span class="inline-flex items-center rounded-full px-2 py-0.5 text-xs font-medium" style="color: var(--state-error); background-color: rgba(239, 68, 68, 0.1);">+120,000</span>
                                    </td>
                                </tr>
                                <tr class="border-b border-border transition-colors hover:bg-muted/30">

                                    <td class="px-4 py-3">宁德时代</td>
                                    <td class="px-4 py-3">张三</td>

                                    <td class="px-4 py-3">

                                    </td>
                                </tr>
                                <tr class="transition-colors hover:bg-muted/30">
                                    <td class="px-4 py-3 tabular-nums">600519</td>
                                    <td class="px-4 py-3">贵州茅台</td>
                                    <td class="px-4 py-3">张三</td>
                                    <td class="px-4 py-3 tabular-nums">1,200,000</td>
                                    <td class="px-4 py-3 whitespace-nowrap tabular-nums">2025-12-31</td>

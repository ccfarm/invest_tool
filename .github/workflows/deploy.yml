name: 部署到阿里云服务器

on:
  push:
    branches: [main]
  workflow_dispatch: # 支持在 GitHub 页面手动触发

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: SSH 部署到服务器
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          port: ${{ secrets.DEPLOY_PORT }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -euo pipefail
            cd /opt/invest_tool
            # 读取服务器环境变量（可覆盖 DATA_DIR/DB_PATH）
            set -a
            [ -f /etc/invest-tool.env ] && . /etc/invest-tool.env
            set +a
            DATA_DIR="${DATA_DIR:-/var/lib/invest_tool}"
            DB_FILE="${DB_PATH:-$DATA_DIR/shareholders.db}"
            # 阿里云服务器直连 GitHub 偶发 TLS 断连：HTTP/1.1 + 重试 5 次
            export GIT_TERMINAL_PROMPT=0
            git config http.version HTTP/1.1 || true
            fetch_ok=0
            for i in 1 2 3 4 5; do
              echo "==> git fetch (attempt $i/5)"
              if git fetch origin; then
                fetch_ok=1
                break
              fi
              sleep 5
            done
            if [ "$fetch_ok" != "1" ]; then
              echo "==> git fetch 连续 5 次失败，终止部署"
              exit 1
            fi
            # 数据安全：备份 → 恢复 → 一次性迁移，全部在仓库外进行
            mkdir -p "$DATA_DIR" /opt/invest_tool_backups
            if [ -f "$DB_FILE" ]; then
              cp "$DB_FILE" \
                "/opt/invest_tool_backups/shareholders-$(date +%Y%m%d-%H%M%S).db"
              ls -1t /opt/invest_tool_backups/shareholders-*.db 2>/dev/null \
                | tail -n +15 | xargs -r rm -f
            fi
            # 若库缺失或为空，先从最近的备份恢复（优先于旧位置遗留文件）
            if [ ! -s "$DB_FILE" ]; then
              latest=$(ls -1t /opt/invest_tool_backups/shareholders-*.db 2>/dev/null | head -1 || true)
              if [ -n "$latest" ]; then
                echo "==> 数据库缺失，从备份恢复：$latest"
                cp "$latest" "$DB_FILE"
              fi
            fi
            # 一次性迁移：新位置仍无库且旧位置（仓库内）有库时复制过去
            if [ ! -f "$DB_FILE" ] && [ -f backend/data/shareholders.db ]; then
              echo "==> 迁移数据库到 $DB_FILE"
              cp backend/data/shareholders.db "$DB_FILE"
            fi
            git reset --hard origin/main
            bash scripts/deploy_server.sh
